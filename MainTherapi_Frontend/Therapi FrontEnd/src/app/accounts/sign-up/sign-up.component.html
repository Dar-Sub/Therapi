<div class="login-container">
    <img src="/images/favicon1 (1).png" alt="Logo" class="logo" />
    <div class="login-card">
        <form [formGroup]="registerForm">
            <div class="input-group">
                <input type="text" placeholder="Username" class="input-field" formControlName="name" (keydown.enter)="focusNext('email')" />
                <div *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" class="error mt-2 ms-2">
                    <small style="color: brown;" *ngIf="registerForm.get('name')?.errors?.['required']">Name is
                        required</small>
                    <small style="color: brown;" *ngIf="registerForm.get('name')?.errors?.['minlength']">Name must be at
                        least 3 characters long</small>
                </div>
            </div>
            <div class="input-group">
                <input type="email" placeholder="E-mail" id="email" class="input-field" formControlName="email" (keydown.enter)="focusNext('password')" />
                <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error mt-2 ms-2">
                    <small style="color: brown;" *ngIf="registerForm.get('email')?.errors?.['required']">Email is
                        required</small>
                    <small style="color: brown;" *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email
                        format</small>
                </div>
            </div>
            <div class="input-group password-group">
                <div class="password-group-body"> 
                    <input [type]="passwordFieldType" type="password" placeholder="Password" class="input-field"
                    id="password" formControlName="password"  (keydown.enter)="register()" />
                <span class="toggle-password" (click)="togglePassword()" style="border-radius: 15px;">
                    <div *ngIf="passwordFieldType === 'password'">
                        <i class="fa-solid fa-eye show-icon"></i>
                    </div>
                    <div *ngIf="passwordFieldType === 'text'">
                        <i class="fa-solid fa-eye-slash hide-icon"></i>
                    </div>
                </span>
                </div>
              
                <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
                    class="error mt-2 ms-2">
                    <small style="color: brown;" *ngIf="registerForm.get('password')?.errors?.['required']">Password is
                        required</small>
                    <small style="color: brown;" *ngIf="registerForm.get('password')?.errors?.['minlength']">Password
                        must be at least 8 characters long</small>
                    <small style="color: brown;" *ngIf="registerForm.get('password')?.errors?.['pattern']">Password must
                        contain at least 1 uppercase letter and 1 number</small>
                </div>
            </div>
            <button type="submit" class="login-button" (click)="register()"
                [disabled]="isLoading || registerForm.invalid">
                <div class="spinner-border" role="status" *ngIf="isLoading">
                </div>
                {{isLoading ? 'Please wait...' :'Sign Up'}}
            </button>
            <div class="d-flex flex-row align-items-center justify-content-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                <p class="mt-3">Click here to <span class="back-login" (click)="BackToLogin()">Login</span> </p>
            </div>
        </form>
    </div>
</div>
