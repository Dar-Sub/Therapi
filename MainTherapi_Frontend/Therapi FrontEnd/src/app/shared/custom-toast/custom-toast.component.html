<div *ngIf="toast" class="toast-container">
  <div class="toast" [ngClass]="toast.type">
      <span class="toast-icon" [ngStyle]="{ 'background-color': getToastColor(toast.type) }">
          <i [ngClass]="getToastIcon(toast.type)"></i>
      </span>
      <div class="toast-content">
          <strong class="toast-title">{{ toast.title }}</strong>
          <p class="toast-message">{{ toast.message }}</p>
      </div>
      <button class="toast-close" (click)="dismissToast()">✖</button>
  </div>
</div>
