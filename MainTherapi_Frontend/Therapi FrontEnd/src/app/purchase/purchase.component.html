<div class="purchase">
    <div class="subscription-container">
        <!-- <div class="top-bar">
            <span class="user-info">User007 | Available Sessions: <b>0</b></span>
            <div class="action-buttons">
                <button class="profile-button">View Profile</button>
                <button class="chat-button">Chat</button>
                <button class="logout-button">Logout</button>
            </div>
        </div> -->

        <!-- Tabs Section -->
        <div class="purchase_main_content">
            <div class="tabs">
                <button class="tab" (click)="selectTab('purchase')"
                    [class.active]="selectedTab === 'purchase'">Purchase</button>
                <button class="tab" (click)="selectTab('redeem')" [class.active]="selectedTab === 'redeem'">Redeem
                    Code</button>
                <!-- <button class="tab" (click)="selectTab('history')"
                    [class.active]="selectedTab === 'history'">History</button> -->
            </div>

            <!-- Dynamic Content Based on Tabs -->
            <div class="tab-content">
                <div *ngIf="selectedTab === 'purchase'" class="cards-section">
                    <div class="card">
                        <h3>Single Session</h3>
                        <p class="price">$20</p>
                        <p class="description">One full session with our AI therapist</p>
                        <button class="purchase-btn" (click)="showPopup()">Purchase</button>
                    </div>
                    <div class="card">
                        <h3>Monthly Subscription</h3>
                        <p class="price">$120</p>
                        <p class="description">Unlimited sessions for 30 days</p>
                        <button class="purchase-btn" (click)="showPopup()">Purchase</button>
                    </div>
                    <div class="card">
                        <h3>Gift Card</h3>
                        <p class="price">From $20</p>
                        <p class="description">Give the gift of therapy</p>
                        <button class="purchase-btn" (click)="showPopup()">Purchase</button>
                    </div>
                </div>

                <div *ngIf="selectedTab === 'redeem'" class="redeem-section gap-4">
                    <h3>Redeem Your Code</h3>
                    <div class="d-flex flex-column align-items-center justify-content-center w-100">
                        <input type="text" placeholder="Enter your code" class="redeem-input" />
                        <button class="redeem-btn">Redeem</button>
                    </div>
                </div>

                <!-- <div *ngIf="selectedTab === 'history'" class="history-section">
                    <h3>Purchase History</h3>
                    <p>No purchases made yet.</p>
                </div> -->
            </div>
        </div>
    </div>
</div>
